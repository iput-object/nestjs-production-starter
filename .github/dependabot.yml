# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: "main"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # Nest CLI ships TypeScript 6. The next major (TS 7) breaks nest-cli.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - '@prisma/*'
          - prisma
      oxlint:
        patterns:
          - oxlint
          - oxlint-tsgolint
      opentelemetry:
        # Versions must move together to avoid duplicate SDK internals.
        patterns:
          - '@opentelemetry/*'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: docker
    directory: /
    target-branch: "main"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: "main"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
